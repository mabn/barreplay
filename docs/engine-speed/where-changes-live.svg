  <rect x="20" y="40" width="860" height="52" rx="6" fill="#e6e7ea" stroke="#8a919c"/>
  <text x="34" y="61" font-weight="bold">Revision 3: patched-engine/2026.7.4-barreplay.3 (older tag)</text>
  <text x="34" y="80" font-size="12" fill="#5d6470">unpaced playback, exit-only yardmap grid, PGO + LTO, lazy pool zeroing, engine event log</text>
