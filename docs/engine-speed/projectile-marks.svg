  <text x="380" y="62" font-weight="bold">Each frame, before the pass:</text>
  <text x="380" y="82" font-size="12">every projectile&#x27;s detection (what it would hit) runs on all threads.</text>
  <text x="380" y="108" font-weight="bold">Then the pass, in the stock order:</text>
  <text x="380" y="128" font-size="12" fill="#b0602a">a  hits a unit: it acts, and the cells of what it touched are marked</text>
  <text x="380" y="148" font-size="12">b, e  found nothing, but the query reads a marked cell: runs as stock</text>
  <text x="380" y="168" font-size="12" fill="#0f8f86">c, d  found nothing and read no marked cell: skipped</text>
  <text x="380" y="188" font-size="12" fill="#0f8f86">     (the synced tempNum its query would have drawn is still drawn)</text>
  <text x="380" y="214" font-size="12">Cells are 256 elmos. A Lua write, a unit or shield changing quads</text>
  <text x="380" y="232" font-size="12">or a dying transport marks everything; v2 lets a Lua write mark</text>
  <text x="380" y="250" font-size="12">just its unit. A check mode reran every skip as stock: 0 of 97,515</text>
  <text x="380" y="268" font-size="12">acted. Late window: 34% skipped, 59% found a marked cell.</text>
  <text x="40" y="276" font-size="12" fill="#5d6470">shaded: cells marked so far this pass</text>
