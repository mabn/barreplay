  <text x="452.0" y="167" text-anchor="middle" font-size="11">10</text>
  <rect x="470" y="152" width="30" height="22" rx="2" fill="#d5efec" stroke="#0f8f86"/>
  <text x="485.0" y="167" text-anchor="middle" font-size="11">11</text>
  <rect x="503" y="152" width="30" height="22" rx="2" fill="#d5efec" stroke="#0f8f86"/>
  <text x="518.0" y="167" text-anchor="middle" font-size="11">12</text>
  <rect x="536" y="152" width="30" height="22" rx="2" fill="#d5efec" stroke="#0f8f86"/>
  <text x="551.0" y="167" text-anchor="middle" font-size="11">13</text>
  <rect x="569" y="152" width="30" height="22" rx="2" fill="#d5efec" stroke="#0f8f86"/>
