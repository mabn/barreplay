  <rect x="767" y="152" width="30" height="22" rx="2" fill="#ffffff" stroke="#d9d6cf"/>
  <text x="782.0" y="167" text-anchor="middle" font-size="11">20</text>
  <rect x="800" y="152" width="30" height="22" rx="2" fill="#ffffff" stroke="#d9d6cf"/>
  <text x="815.0" y="167" text-anchor="middle" font-size="11">21</text>
  <rect x="833" y="152" width="30" height="22" rx="2" fill="#ffffff" stroke="#d9d6cf"/>
