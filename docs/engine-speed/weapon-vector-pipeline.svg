  <rect width="900" height="380" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold">P8: the weapon-vector section folded into the weapon loop as a pipeline</text>
  <text x="20" y="56" font-weight="bold">before</text>
  <text x="130" y="83" text-anchor="end" font-size="12" fill="#5d6470">main</text>
  <rect x="140" y="66" width="150" height="22" rx="4" fill="#d5efec" stroke="#0f8f86"/>
  <text x="215" y="81" text-anchor="middle" font-size="11">vectors: its third</text>
  <rect x="294" y="66" width="40" height="22" rx="4" fill="#f6e3d4" stroke="#b0602a"/>
  <text x="314" y="81" text-anchor="middle" font-size="11">wait</text>
  <rect x="338" y="66" width="540" height="22" rx="4" fill="#e6e7ea" stroke="#8a919c"/>
  <text x="608" y="81" text-anchor="middle" font-size="12">weapon loop, unit by unit</text>
  <text x="130" y="109" text-anchor="end" font-size="12" fill="#5d6470">workers</text>
  <rect x="140" y="92" width="190" height="18" rx="2" fill="#d5efec"/>
  <text x="235" y="105" text-anchor="middle" font-size="11">vectors: the rest</text>
  <text x="20" y="142" font-weight="bold">with P8</text>
  <text x="130" y="167" text-anchor="end" font-size="12" fill="#5d6470">units</text>
  <rect x="140" y="152" width="30" height="22" rx="2" fill="#e6e7ea" stroke="#8a919c"/>
