  <path d="M369 140 L369 184" stroke="#1d1f23" stroke-width="2" fill="none"/>
  <text x="369" y="136" text-anchor="middle" font-size="11">weapon loop (main)</text>
  <path d="M633 140 L633 184" stroke="#0f8f86" stroke-width="2" fill="none"/>
  <text x="675" y="136" text-anchor="middle" font-size="11" fill="#0f8f86">workers&#x27; frontier</text>
  <path d="M352 178 C 437 214, 668 214, 748 178" stroke="#b0602a" stroke-width="1.5" fill="none" marker-end="url(#o)"/>
  <text x="536" y="226" font-size="12" fill="#b0602a" text-anchor="middle">unit 7&#x27;s shot hits unit 19 ahead of the frontier: unit 19 is made ready (its vectors computed) before the damage</text>
  <rect x="140" y="250" width="12" height="12" rx="2" fill="#e6e7ea" stroke="#8a919c"/>
  <text x="158" y="261" font-size="12">updated</text>
  <rect x="240" y="250" width="12" height="12" rx="2" fill="#d5efec" stroke="#0f8f86"/>
  <text x="258" y="261" font-size="12">vectors ready</text>
  <rect x="370" y="250" width="12" height="12" rx="2" fill="#ffffff" stroke="#d9d6cf"/>
  <text x="388" y="261" font-size="12">not yet computed</text>
  <text x="140" y="292" font-size="12">A unit is made ready (computed by whoever claims it, else waited for) before its own weapons update, and before anything</text>
  <text x="140" y="310" font-size="12">that changes or reads its vector inputs: damage, a kill or stun, a move or turn, a team or hold-fire change, a transport change,</text>
  <text x="140" y="328" font-size="12">a collision test against its pieces, the shield query, a Lua unit read. A Lua write or an interceptable projectile makes every unit</text>
  <text x="140" y="346" font-size="12">ready. The old section had an unwritten second job: it left every aim and muzzle piece matrix clean, so later readers in the</text>
  <text x="140" y="364" font-size="12">loop never wrote them. The pipeline had to take that over too. -2.7% / -2.9%.</text>
</svg>
