<svg xmlns="http://www.w3.org/2000/svg" width="900" height="338" viewBox="0 0 900 338" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1f23">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6470"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b0602a"/></marker></defs>
  <rect width="900" height="338" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold">COB tick, late window: what script threads do, by share of the tick&#x27;s cycles</text>
  <text x="20" y="44" font-size="12" fill="#5d6470">~1,040 thread ticks a frame, ~4.6% of the frame. Grey: share of ticks. Bars: share of cycles.</text>
  <text x="290" y="75" text-anchor="end" font-size="12">animate own unit + sleep</text>
  <rect x="300" y="60" width="155.1" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="65" width="351.45" height="10" rx="2" fill="#0f8f86"/>
  <text x="657.45" y="75" font-size="12">63.9% of cycles, 28.2% of ticks</text>
  <text x="290" y="103" text-anchor="end" font-size="12">read values + animate + sleep</text>
  <rect x="300" y="88" width="61.599999999999994" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="93" width="50.05" height="10" rx="2" fill="#8a919c"/>
  <text x="367.6" y="103" font-size="12">9.1% of cycles, 11.2% of ticks</text>
  <text x="290" y="131" text-anchor="end" font-size="12">read values + sfx + animate + sleep</text>
  <rect x="300" y="116" width="22.549999999999997" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="121" width="28.049999999999997" height="10" rx="2" fill="#8a919c"/>
  <text x="334.05" y="131" font-size="12">5.1% of cycles, 4.1% of ticks</text>
  <text x="290" y="159" text-anchor="end" font-size="12">read a unit value + sleep</text>
  <rect x="300" y="144" width="69.85" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="149" width="18.7" height="10" rx="2" fill="#8a919c"/>
  <text x="375.85" y="159" font-size="12">3.4% of cycles, 12.7% of ticks</text>
  <text x="290" y="187" text-anchor="end" font-size="12">read a unit value + sfx + sleep</text>
  <rect x="300" y="172" width="24.200000000000003" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="177" width="18.15" height="10" rx="2" fill="#8a919c"/>
  <text x="330.2" y="187" font-size="12">3.3% of cycles, 4.4% of ticks</text>
  <text x="290" y="215" text-anchor="end" font-size="12">read a unit value + animate + sleep</text>
  <rect x="300" y="200" width="42.35" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="205" width="15.95" height="10" rx="2" fill="#8a919c"/>
  <text x="348.35" y="215" font-size="12">2.9% of cycles, 7.7% of ticks</text>
  <text x="290" y="243" text-anchor="end" font-size="12">rand + read a unit value + sleep</text>
  <rect x="300" y="228" width="42.9" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="233" width="9.9" height="10" rx="2" fill="#8a919c"/>
  <text x="348.9" y="243" font-size="12">1.8% of cycles, 7.8% of ticks</text>
  <text x="290" y="271" text-anchor="end" font-size="12">the script thread dies</text>
  <rect x="300" y="256" width="31.9" height="20" rx="2" fill="#e6e7ea"/>
  <rect x="300" y="261" width="7.15" height="10" rx="2" fill="#8a919c"/>
  <text x="337.9" y="271" font-size="12">1.3% of cycles, 5.8% of ticks</text>
  <text x="20" y="306" font-size="12">The first row touches nothing but its own unit&#x27;s script and pieces: walk cycles and turret idles. Running those</text>
  <text x="20" y="324" font-size="12">ticks on the workers, in order per unit, is what P5 does; its ceiling was about 2.5% of the frame, and it measured -1.2%.</text>
</svg>
