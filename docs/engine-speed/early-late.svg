  <text x="486.9" y="103" font-size="12" text-anchor="end" fill="#1d1f23">-3.7%</text>
  <rect x="726.7" y="88" width="53.3" height="20" rx="2" fill="#0f8f86"/>
  <text x="721.7" y="103" font-size="12" text-anchor="end" fill="#1d1f23">-4.1%</text>
  <text x="150" y="137" text-anchor="end" font-weight="normal">P5</text>
  <rect x="300" y="122" width="5.2" height="20" rx="2" fill="#b0602a"/>
  <text x="310.2" y="137" font-size="12" text-anchor="start" fill="#b0602a">+0.4%</text>
  <rect x="530.9" y="122" width="9.1" height="20" rx="2" fill="#0f8f86"/>
  <text x="525.9" y="137" font-size="12" text-anchor="end" fill="#1d1f23">-0.7%</text>
  <rect x="764.4" y="122" width="15.6" height="20" rx="2" fill="#0f8f86"/>
  <text x="759.4" y="137" font-size="12" text-anchor="end" fill="#1d1f23">-1.2%</text>
