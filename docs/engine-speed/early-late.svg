  <text x="150" y="273" text-anchor="end" font-weight="bold">all five together</text>
  <rect x="300" y="258" width="87.10000000000001" height="20" rx="2" fill="#b0602a"/>
  <text x="392.1" y="273" font-size="12" text-anchor="start" fill="#b0602a">+6.7%</text>
  <rect x="507.5" y="258" width="32.5" height="20" rx="2" fill="#0f8f86"/>
  <text x="502.5" y="273" font-size="12" text-anchor="end" fill="#1d1f23">-2.5%</text>
  <rect x="695.5" y="258" width="84.5" height="20" rx="2" fill="#0f8f86"/>
  <text x="690.5" y="273" font-size="12" text-anchor="end" fill="#1d1f23">-6.5%</text>
  <text x="20" y="332" font-size="12">Orange is slower. Every item had been measured only on the late window, where all five won. With a few hundred units their</text>
  <text x="20" y="350" font-size="12">fixed per-frame costs (waking workers, publishing tasks, clearing an index) were bigger than the work they moved. P7 now runs</text>
  <text x="20" y="368" font-size="12">only in frames with at least 6,000 units, P8 from 2,048, P11 and H100 from 512 entries, and every A/B runs five windows.</text>
