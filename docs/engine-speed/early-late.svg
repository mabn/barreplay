  <text x="515.5" y="171" font-size="12" text-anchor="end" fill="#1d1f23">-1.5%</text>
  <rect x="756.6" y="156" width="23.400000000000002" height="20" rx="2" fill="#0f8f86"/>
  <text x="751.6" y="171" font-size="12" text-anchor="end" fill="#1d1f23">-1.8%</text>
  <text x="150" y="205" text-anchor="end" font-weight="normal">N2</text>
  <rect x="290.9" y="190" width="9.1" height="20" rx="2" fill="#0f8f86"/>
