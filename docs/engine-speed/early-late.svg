  <rect x="540" y="224" width="37.699999999999996" height="20" rx="2" fill="#b0602a"/>
  <text x="582.7" y="239" font-size="12" text-anchor="start" fill="#b0602a">+2.9%</text>
  <rect x="760.5" y="224" width="19.5" height="20" rx="2" fill="#0f8f86"/>
