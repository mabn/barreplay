  <text x="746.4" y="205" font-size="12" text-anchor="end" fill="#1d1f23">-2.2%</text>
  <text x="150" y="239" text-anchor="end" font-weight="normal">P7</text>
  <rect x="300" y="224" width="98.8" height="20" rx="2" fill="#b0602a"/>
