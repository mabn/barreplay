<svg xmlns="http://www.w3.org/2000/svg" width="900" height="382" viewBox="0 0 900 382" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1f23">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6470"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b0602a"/></marker></defs>
  <rect width="900" height="382" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold">The same changes at three points of the game (wall time against the build without them)</text>
  <text x="20" y="44" font-size="12" fill="#5d6470">early: frame 15,000, 1,405 units, 1.4 ms a frame;  middle: frame 35,000, 3,719 units, 5.1 ms;  late: frame 63,780, 9,961 units, 24 ms</text>
  <text x="300" y="74" text-anchor="middle" font-weight="bold">early</text>
  <path d="M300 82 L300 286" stroke="#1d1f23" stroke-width="1" fill="none"/>
  <text x="540" y="74" text-anchor="middle" font-weight="bold">middle</text>
  <path d="M540 82 L540 286" stroke="#1d1f23" stroke-width="1" fill="none"/>
  <text x="780" y="74" text-anchor="middle" font-weight="bold">late</text>
  <path d="M780 82 L780 286" stroke="#1d1f23" stroke-width="1" fill="none"/>
  <text x="150" y="103" text-anchor="end" font-weight="normal">P4</text>
  <rect x="292.2" y="88" width="7.8" height="20" rx="2" fill="#0f8f86"/>
  <text x="287.2" y="103" font-size="12" text-anchor="end" fill="#1d1f23">-0.6%</text>
