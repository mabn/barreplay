<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1f23">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6470"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b0602a"/></marker></defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold">The P4 race: a unit turned for a few microseconds, seen by an ally&#x27;s search on another thread</text>
  <text x="130" y="69" text-anchor="end" font-size="12" fill="#5d6470">main</text>
  <rect x="140" y="52" width="120" height="26" rx="4" fill="#e6e7ea" stroke="#8a919c"/>
  <text x="200" y="69" text-anchor="middle" font-size="12">slow update</text>
  <rect x="264" y="52" width="380" height="26" rx="4" fill="#f6e3d4" stroke="#b0602a"/>
  <text x="454" y="69" text-anchor="middle" font-size="12">Glaucus B: TryTargetHeading</text>
  <rect x="648" y="52" width="200" height="26" rx="4" fill="#e6e7ea" stroke="#8a919c"/>
  <text x="748" y="69" text-anchor="middle" font-size="12">slow update</text>
  <text x="270" y="100" font-size="11" fill="#b0602a">turn B</text>
  <text x="430" y="100" font-size="11" fill="#b0602a">TryTarget</text>
  <text x="566" y="100" font-size="11" fill="#b0602a">turn B back</text>
  <path d="M268 84 L268 140" stroke="#b0602a" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M640 84 L640 140" stroke="#b0602a" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <text x="130" y="137" text-anchor="end" font-size="12" fill="#5d6470">worker</text>
  <rect x="140" y="120" width="620" height="26" rx="4" fill="#d5efec" stroke="#0f8f86"/>
  <text x="300" y="137" text-anchor="middle" font-size="12">Glaucus A&#x27;s target search: line-of-fire ray past its ally B</text>
  <circle cx="530" cy="133" r="6" fill="#b0602a"/>
  <text x="470" y="172" font-size="12" fill="#b0602a" text-anchor="middle">the ray reads B&#x27;s collision volume while it is rotated: the Goblin behind B looks like a free shot</text>
  <text x="20" y="206" font-weight="bold">How it showed:</text>
  <text x="130" y="206" font-size="12">about half the whole-game runs; first difference at frame 66,706 (a kill credited to the wrong unit).</text>
  <text x="20" y="226" font-weight="bold">Why tests missed it:</text>
  <text x="160" y="226" font-size="12">the write is undone a few lines later, so every check between slow updates sees the right state.</text>
  <text x="20" y="246" font-weight="bold">How it was found:</text>
  <text x="145" y="246" font-size="12">a race detector reran each search after two more slow updates: 8.0M checks, 3 differences, all Goblins;</text>
  <text x="145" y="264" font-size="12">then a thread spinning on the same TryTarget saw it flip 0 -&gt; 1 -&gt; 0 inside B&#x27;s command AI.</text>
  <text x="20" y="284" font-weight="bold">The fix:</text>
  <text x="85" y="284" font-size="12">before turning a unit, wait for the running searches of its ally team whose area holds it.</text>
</svg>
