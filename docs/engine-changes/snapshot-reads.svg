<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Today: in-place, order-dependent reads</text>
  <text x="460" y="28" font-size="16" font-weight="bold">Proposed: read last frame, write this frame</text>
  <g>
    <text x="30" y="60">loop order →</text>
    <g fill="#d9e8f6" stroke="#3a6ea5"><rect x="30" y="72" width="60" height="30"/><rect x="95" y="72" width="60" height="30"/></g>
    <rect x="160" y="72" width="60" height="30" fill="#ffe08a" stroke="#b7950b"/>
    <g fill="#f2f2f2" stroke="#999"><rect x="225" y="72" width="60" height="30"/><rect x="290" y="72" width="60" height="30"/><rect x="355" y="72" width="60" height="30"/></g>
    <g text-anchor="middle"><text x="60" y="92">A′</text><text x="125" y="92">B′</text><text x="190" y="92">C</text><text x="255" y="92">D</text><text x="320" y="92">E</text><text x="385" y="92">F</text></g>
    <text x="30" y="130">C (updating) sees A, B already moved this frame, D, E, F</text>
    <text x="30" y="148">not yet. Every read of a neighbour or a target is an</text>
    <text x="30" y="166">ordering edge (here: C after A, B; C before D, E, F).</text>
    <rect x="30" y="182" width="12" height="12" fill="#d9e8f6" stroke="#3a6ea5"/><text x="48" y="193">new state (frame N+1)</text>
    <rect x="200" y="182" width="12" height="12" fill="#f2f2f2" stroke="#999"/><text x="218" y="193">old state (frame N)</text>
    <text x="30" y="230" fill="#c0392b">Our exact parallel aircraft loop must keep "after/before my</text>
    <text x="30" y="248" fill="#c0392b">target" edges and start aircraft in loop order.</text>
  </g>
  <g>
    <rect x="470" y="60" width="370" height="30" fill="#f2f2f2" stroke="#999"/>
    <text x="655" y="80" text-anchor="middle">frame N state (read-only during the pass)</text>
    <g stroke="#2e7d32" stroke-width="2" marker-end="url(#g)">
      <path d="M520 92 V126"/><path d="M600 92 V126"/><path d="M680 92 V126"/><path d="M760 92 V126"/>
    </g>
    <g fill="#e6f4ea" stroke="#2e7d32"><rect x="480" y="130" width="80" height="30"/><rect x="565" y="130" width="80" height="30"/><rect x="650" y="130" width="80" height="30"/><rect x="735" y="130" width="80" height="30"/></g>
    <g text-anchor="middle"><text x="520" y="150">A′</text><text x="605" y="150">B′</text><text x="690" y="150">C′</text><text x="775" y="150">…</text></g>
    <text x="470" y="190">Every unit reads only frame-N positions of others and</text>
    <text x="470" y="208">writes its own frame-N+1 state: the loop is order-free,</text>
    <text x="470" y="226">a plain parallel-for. Rare cross-unit writes (pushes,</text>
    <text x="470" y="244">damage) become queued "effects", applied after the pass</text>
    <text x="470" y="262">in a canonical order (e.g. sorted by unit id).</text>
  </g>
  <defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e7d32"/></marker></defs>
</svg>
