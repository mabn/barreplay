<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Late game, main thread: where the time goes and what keeps it there</text>
  <text x="20" y="48" fill="#555">verylarge1 at frame 63,780 (~10,000 units), patched engine with every exact change on, 7 threads. % of one core, inclusive: rows overlap.</text>
  <g font-size="13">
    <text x="300" y="86" text-anchor="end">parallel sections, main thread's own share</text><rect x="310" y="73" width="398" height="18" fill="#a9d18e"/><text x="714" y="87">19.9%</text>
    <text x="300" y="114" text-anchor="end">synced Lua (BAR gadgets), all callers</text><rect x="310" y="101" width="280" height="18" fill="#f4b183"/><text x="596" y="115">14.0%</text>
    <text x="300" y="142" text-anchor="end">weapon slow update (target search)</text><rect x="310" y="129" width="212" height="18" fill="#c9a0dc"/><text x="528" y="143">10.6%</text>
    <text x="300" y="170" text-anchor="end">aircraft movement loop</text><rect x="310" y="157" width="194" height="18" fill="#9dc3e6"/><text x="510" y="171">9.7%</text>
    <text x="300" y="198" text-anchor="end">weapon update (firing, beam lasers 5.9)</text><rect x="310" y="185" width="176" height="18" fill="#c9a0dc"/><text x="492" y="199">8.8%</text>
    <text x="300" y="226" text-anchor="end">COB script tick</text><rect x="310" y="213" width="116" height="18" fill="#ffd966"/><text x="432" y="227">5.8%</text>
    <text x="300" y="254" text-anchor="end">unit slow update (command AI, economy)</text><rect x="310" y="241" width="110" height="18" fill="#c9a0dc"/><text x="426" y="255">5.5%</text>
    <text x="300" y="282" text-anchor="end">explosions</text><rect x="310" y="269" width="76" height="18" fill="#d9d9d9"/><text x="392" y="283">3.8%</text>
    <text x="300" y="310" text-anchor="end">CUnit::Update</text><rect x="310" y="297" width="72" height="18" fill="#d9d9d9"/><text x="388" y="311">3.6%</text>
    <text x="300" y="338" text-anchor="end">projectiles</text><rect x="310" y="325" width="64" height="18" fill="#d9d9d9"/><text x="380" y="339">3.2%</text>
  </g>
  <g font-size="12">
    <rect x="20" y="368" width="14" height="14" fill="#a9d18e"/><text x="40" y="380">already parallel (LOS, unit LOS states, ground movement, paths): the main thread works its share, then waits for the slowest worker</text>
    <rect x="20" y="390" width="14" height="14" fill="#f4b183"/><text x="40" y="402">Lua: one interpreter, called from inside the unit loops, may read or write anything, so it runs in order on the main thread</text>
    <rect x="20" y="412" width="14" height="14" fill="#c9a0dc"/><text x="40" y="424">serial loops held in order by the shared RNG, team resources, COB calls, Lua callins and damage dealt mid-loop</text>
    <rect x="20" y="434" width="14" height="14" fill="#9dc3e6"/><text x="40" y="446">runs on all threads already, but must start aircraft in loop order and wait at every RNG draw</text>
    <rect x="20" y="456" width="14" height="14" fill="#ffd966"/><text x="40" y="468">COB: per-unit bytecode, but rand and a few global opcodes keep it serial</text>
  </g>
</svg>
