<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Today: float totals depend on the order</text>
  <text x="470" y="28" font-size="16" font-weight="bold">Proposed: fixed-point integers</text>
  <g>
    <rect x="30" y="50" width="400" height="120" rx="6" fill="#fde2e1" stroke="#c0392b"/>
    <text x="45" y="74" font-weight="bold">32-bit float, same three numbers, two orders</text>
    <text x="45" y="98" font-family="monospace">(16777216 + 1) + 1  = 16777216</text>
    <text x="45" y="120" font-family="monospace">16777216 + (1 + 1)  = 16777218</text>
    <text x="45" y="148" fill="#c0392b">Every AddResources / UseResources rounds. A team's metal is</text>
    <text x="45" y="164" fill="#c0392b">hundreds of such steps a frame, so units must run in loop order.</text>
  </g>
  <g>
    <rect x="470" y="50" width="400" height="120" rx="6" fill="#e2f0d9" stroke="#548235"/>
    <text x="485" y="74" font-weight="bold">int64 in thousandths of a unit</text>
    <text x="485" y="98" font-family="monospace">a + b + c == c + a + b, always</text>
    <text x="485" y="122">Each thread sums its own units' income and upkeep,</text>
    <text x="485" y="140">the partial sums are combined at the end: bit-identical</text>
    <text x="485" y="158">whatever the thread count or schedule.</text>
  </g>
  <text x="20" y="208" font-size="16" font-weight="bold">The other half: who gets resources when a team is short</text>
  <g>
    <text x="30" y="236" font-weight="bold">Today: first come, first served (CTeam::UseMetal)</text>
    <rect x="30" y="250" width="400" height="26" fill="#f2f2f2" stroke="#999"/>
    <rect x="30" y="250" width="200" height="26" fill="#9dc3e6"/><text x="130" y="268" text-anchor="middle">team has 100 metal</text>
    <g font-size="11">
      <rect x="30" y="292" width="128" height="22" fill="#a9d18e"/><text x="94" y="307" text-anchor="middle">unit 1 asks 60: gets 60</text>
      <rect x="164" y="292" width="128" height="22" fill="#a9d18e"/><text x="228" y="307" text-anchor="middle">unit 2 asks 40: gets 40</text>
      <rect x="298" y="292" width="132" height="22" fill="#f4b183"/><text x="364" y="307" text-anchor="middle">unit 3 asks 50: gets 0</text>
    </g>
    <text x="30" y="340" fill="#c0392b">Run unit 3 first and it is unit 2 that stalls.</text>
    <text x="30" y="358" fill="#c0392b">Integers alone do not fix this: the decision depends on order.</text>
  </g>
  <g>
    <text x="470" y="236" font-weight="bold">Proposed: collect requests, then grant one share</text>
    <rect x="470" y="250" width="400" height="26" fill="#f2f2f2" stroke="#999"/>
    <rect x="470" y="250" width="200" height="26" fill="#9dc3e6"/><text x="570" y="268" text-anchor="middle">team has 100 metal</text>
    <g font-size="11">
      <rect x="470" y="292" width="120" height="22" fill="#ffd966"/><text x="530" y="307" text-anchor="middle">unit 1: 60 x 2/3 = 40</text>
      <rect x="600" y="292" width="120" height="22" fill="#ffd966"/><text x="660" y="307" text-anchor="middle">unit 2: 40 x 2/3 = 27</text>
      <rect x="730" y="292" width="140" height="22" fill="#ffd966"/><text x="800" y="307" text-anchor="middle">unit 3: 50 x 2/3 = 33</text>
    </g>
    <text x="470" y="340">150 asked, 100 available: everyone gets 2/3, in any order.</text>
    <text x="470" y="358">Builders and factories then work at 2/3 speed.</text>
  </g>
  <text x="30" y="410" font-size="12" fill="#555">Neither half is faster arithmetic. Together they remove one of the reasons the unit slow-update loop must run units one at a time,</text>
  <text x="30" y="426" font-size="12" fill="#555">in their original order. The second half changes how a shortage plays out (which unit stalls), so it is a gameplay rule</text>
  <text x="30" y="442" font-size="12" fill="#555">change that BAR and the Recoil maintainers would have to agree to.</text>
</svg>
