<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barreplay viewer</title>
<!-- SVG first for browsers that take it (one file, crisp at every size); the
     .ico is the fallback and is also what a browser fetches on its own from
     /favicon.ico without being told to. Deliberately NOT fingerprinted: that
     implicit request is for a fixed path, so the name cannot carry a hash. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/favicon.png">
<!-- __ASSET_REV__ is replaced with a content hash of app.js+style.css (Vite
     plugin at build/dev; the Go viz server at startup). The hash is in the
     FILENAME, not a ?v= query, so a given byte sequence has a URL that never
     changes and the file can be served immutable for a year (public/_headers).
     Only index.html revalidates — both servers send it no-cache — and because
     a UI change moves these URLs, browsers refetch exactly the files that
     changed, with no hard refresh. -->
<link rel="stylesheet" href="/style.__ASSET_REV__.css">
</head>
<body>
<header>
  <h1><a href="./" id="homelink" title="All replays">barreplay</a><span class="sub" id="subtitle">replay state viewer</span></h1>
  <!-- Point-of-view marking. Most catalog rows carry no recorder provenance
       (their captures predate the GAME record's recorder fields) and it cannot
       be derived after the fact, so it is marked by hand here. Shown only in
       admin mode (?admin=true): the marking is a property of the replay, not
       of the visitor looking at it. -->
  <div id="viewmark" style="display:none"
       title="Whose point of view this capture is from. A spectator recording sees every team; a player's recording only sees their own side plus what it scouted.">
    <label for="viewsel">POV</label>
    <select id="viewsel"></select>
    <span id="viewstatus"></span>
  </div>
</header>

<!-- Landing view: the replay list (shown when no ?replay= is selected). -->
<div id="home" style="display:none">
  <!-- Drag&drop publishing: a .brepstream (the Replay uploader widget's
       capture) POSTs to /api/upload; the worker archives it and the ingest
       daemon publishes it. Hidden with a note on hosts without the API. -->
  <div id="dropzone">
    <span id="droplabel">Drop a <code>.brepstream</code> capture here to publish it —
      or <label class="browse">browse<input type="file" id="dropfile" accept=".brepstream" hidden></label></span>
    <div id="dropstatus" style="display:none"></div>
  </div>
  <!-- Catalog filters. Hidden unless the backend answers GET
       /api/replays/facets: filtering is a SQL feature of the Worker's catalog,
       and the Go viz server (which serves the same list from local files)
       has none, so the bar appears only where it works. -->
  <div id="filters" style="display:none">
    <label>From <input type="date" id="f_from"></label>
    <label>To <input type="date" id="f_to"></label>
    <label>Map <select id="f_map"></select></label>
    <label>Players <select id="f_size"></select></label>
    <label>Player <input type="search" id="f_player" list="f_players" placeholder="name" autocomplete="off"></label>
    <datalist id="f_players"></datalist>
    <span id="f_settings" class="chips"></span>
    <button type="button" id="f_clear" title="Clear all filters">Clear</button>
    <!-- Admin-only, and deliberately a BUTTON: listing unregistered uploads
         means scanning the whole bucket (~1.5 s), which is not something to
         spend on every page load just because ?admin=true is set. -->
    <button type="button" id="f_orphans" class="admin"
            title="Scan the bucket for uploads that were never registered in the catalog (slow: reads every object)">Unregistered</button>
    <span id="f_count" class="hint"></span>
  </div>
  <table id="hometable">
    <thead>
      <tr><th>Started</th><th>Duration</th><th>Map</th><th>Size</th><th>Players</th><th>Links</th><th>Settings</th><th class="num data">Data</th><th class="admin"></th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="homemsg" class="hint" style="display:none"></div>
</div>

<div id="wrap">
  <div id="left">
    <canvas id="cv"></canvas>
    <canvas id="glcv"></canvas>
    <canvas id="ovcv"></canvas>
    <div id="tooltip"></div>
    <div id="zoomlabel"></div>
    <div id="empty" style="display:none"></div>
  </div>
  <div id="side">
    <h2>Frame</h2>
    <div class="stat"><span>Game time</span><b id="s_time">—</b></div>
    <div class="stat"><span>Sim frame</span><b id="s_frame">—</b></div>
    <div class="stat"><span>Units</span><b id="s_units">—</b></div>

    <h2>Players</h2>
    <div id="players"></div>

    <!-- Chat transcript. Hidden when the capture recorded no messages — a
         re-simulated demo sees every channel, but a live player's upload only
         holds the chat their own client received. -->
    <div id="chatwrap" style="display:none">
      <h2>Chat</h2>
      <div id="chat" title="Click a line to jump to when it was said"></div>
    </div>

    <h2>Controls</h2>
    <button type="button" id="togglebubbles" class="sidebtn"
            title="Chat also pops up over the speaker on the map">Hide chat bubbles</button>
    <div class="hint">
      Scroll to zoom · middle-drag to pan · hover a unit for details.<br>
      ← / → step · space play/pause.
    </div>
  </div>
</div>

<div class="controls" id="bottombar">
  <button id="first" title="First frame">⏮</button>
  <button id="prev" title="Previous frame (←)">◀</button>
  <button id="play" title="Play / pause (space)">▶ Play</button>
  <button id="next" title="Next frame (→)">▶</button>
  <button id="last" title="Last frame">⏭</button>
  <label style="font-size:12px;color:#9fb0bf;">Speed
    <select id="speed">
      <option value="1">1× (real time)</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
      <option value="16" selected>16×</option>
      <option value="30">30×</option>
      <option value="60">60×</option>
    </select>
  </label>
  <div id="timeline">
    <!-- step="any" so the thumb can sit between samples while playing; a
         DRAG still lands on a whole one, rounded by go(). -->
    <input type="range" id="slider" min="0" max="0" value="0" step="any">
    <div id="buffbar" title="Downloaded ranges"></div>
  </div>
  <span class="timelabel" id="timelabel">—</span>
</div>

<!-- The ORIGIN the bulk replay data (heads, keyframes, chunk deltas, resources)
     is fetched from: the R2 bucket's own hostname, so those reads are answered
     by Cloudflare's cache instead of costing a billed R2 GetObject through the
     Worker. The placeholder below is filled in only by a production
     `vite build`; `vite dev` and the Go viz server both blank it, which means
     "same origin" and keeps them serving their own files. app.js ignores any
     value that is not an absolute http(s) origin, so an unsubstituted
     placeholder degrades to same-origin rather than breaking.

     The placeholder token deliberately differs from the global's name and
     occurs exactly ONCE, in the value position: both substituters do a plain
     textual replace, so a token that also appeared in the identifier would be
     rewritten into `window.https://... =` — invalid JS that no build step
     would flag. -->
<script>window.__DATA_BASE__ = "__DATA_ORIGIN__";</script>
<script src="/app.__ASSET_REV__.js"></script>
</body>
</html>
