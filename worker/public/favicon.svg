<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="barreplay">
  <!-- barreplay: a playback triangle split into two facing halves — the replay,
       and the two sides whose game it is. Colours are the viewer's own accents
       (style.css: #11151a ground, #8fd3ff, #e3c34a) so the tab matches the app.
       This SVG is the source; favicon.ico and favicon.png are rasterized from
       exactly these shapes. -->
  <rect width="32" height="32" rx="7" fill="#11151a"/>
  <path d="M11 7 L16.6 10.6 L16.6 21.4 L11 25 Z"
        fill="#8fd3ff" stroke="#8fd3ff" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M17.4 11.11 L25 16 L17.4 20.89 Z"
        fill="#e3c34a" stroke="#e3c34a" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
