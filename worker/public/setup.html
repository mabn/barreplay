<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FogOfWar for Windows — barreplay</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
<!-- Deliberately SELF-CONTAINED: no /style.<rev>.css, no /app.<rev>.js. The
     viewer's stylesheet is fingerprinted by the build, and only index.html
     goes through the substitution that stamps the hash in — a second page
     referencing it would have to be taught to every substituter, for a static
     page that shares none of the viewer's layout. Inline styles keep this page
     servable verbatim from the asset layer and from `vite dev`. -->
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: radial-gradient(70% 70% at 50% 0%, #6a2b18, #170d10) no-repeat, #170d10;
  color: #f6ebe9;
  line-height: 1.5;
}
header {
  padding: 8px 16px;
  background: transparent;
  border-bottom: 1px solid rgba(255, 170, 130, .17);
  display: flex; align-items: center; gap: 14px;
}
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
header h1 a { color: inherit; text-decoration: none; }
header h1 a:hover { color: #4fdcc4; }
header .sub { color: #957b78; font-weight: 400; font-size: 12px; margin-left: 8px; }
main { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
h2 { font-size: 24px; margin: 0 0 6px; }
.lede { color: #c8afab; margin: 0 0 28px; }

.note { color: #a88f8b; font-size: 13px; }
.shot {
  display: block; width: 100%; height: auto; margin-top: 28px;
  border: 1px solid rgba(255, 170, 130, .17); border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
}
a { color: #4fdcc4; }
.dl {
  display: inline-block; margin: 6px 0 2px;
  padding: 10px 16px; border-radius: 6px;
  background: #4fdcc4; border: 1px solid #4fdcc4; color: #062019;
  font-size: 15px; font-weight: 600; text-decoration: none;
}
.dl:hover { background: #86eadb; border-color: #86eadb; }
.back { margin-top: 26px; }
</style>
</head>
<body>
<header>
  <h1><a href="/" title="All replays">barreplay</a><span class="sub">FogOfWar for Windows</span></h1>
</header>

<main>
  <h2>FogOfWar</h2>
  <p class="lede">Re-simulates Beyond All Reason games on your PC and publishes them here for anyone to watch.</p>

  <!-- releases/latest/download/<asset> is GitHub's own redirect to the newest
       non-draft, non-prerelease release's asset, so a new build published by
       .github/workflows/fogofwar.yml (which marks it latest) is what this
       button serves with no edit here. The asset name must stay FogOfWar.exe. -->
  <p><a class="dl" href="https://github.com/mabn/barreplay/releases/latest/download/FogOfWar.exe">Download FogOfWar.exe</a></p>
  <p class="note">Windows, no install needed. If SmartScreen warns, click <em>More info</em>, then <em>Run anyway</em>.
    <a href="https://github.com/mabn/barreplay/releases">All versions</a></p>

  <img class="shot" src="/fogofwar-app.webp" width="1620" height="1234"
       alt="FogOfWar re-simulating a game: progress, speed, engine memory and CPU, with finished games below">

  <p class="back"><a href="/">&larr; Back to the replays</a></p>
</main>
</body>
</html>
