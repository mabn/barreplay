# Builds FogOfWar.exe (cmd/fogofwar). A release comes from one of:
#
#   a merge to main that changes cmd/fogofwar/VERSION
#                                  -> the release fogofwar/v<VERSION>
#                                     (skipped when that tag already exists)
#   Run workflow, version empty    -> test build, kept as a workflow
#                                     artifact for 14 days, no release
#   Run workflow, version 0.3.0    -> published as the GitHub release
#                                     fogofwar/v0.3.0 (the tag is created at
#                                     the commit the run built)
#   git push origin fogofwar/v0.3.0 -> the same release, from the pushed tag
#
# The exe is not code-signed (docs/fogofwar-release.md).
name: FogOfWar

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.0). Empty = unsigned test build, no release."
        required: false
        default: ""
  push:
    tags:
      - "fogofwar/v*"
    branches:
      - main
    paths:
      - cmd/fogofwar/VERSION

concurrency:
  group: fogofwar-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    defaults:
      run:
        working-directory: cmd/fogofwar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/fogofwar/go.mod
          cache-dependency-path: cmd/fogofwar/go.sum

      # The version goes into three places that must agree: the exe's version
      # resource (winres), main.version (the app logs it and reports it on
      # every job) and the release tag.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            v="${REF_NAME#fogofwar/v}"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # A merge that changed VERSION. Re-landing a version that is
            # already released (a revert, a re-merge) builds but publishes
            # nothing, rather than failing.
            v="$(tr -d ' \r\n' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/fogofwar/v$v" >/dev/null; then
              echo "::notice::fogofwar/v$v is already released; nothing to publish"
              echo "version=$v" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            v="$INPUT_VERSION"
          fi
          if [ -z "$v" ]; then
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # winres takes major.minor.patch only, so a release is exactly that.
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$v' is not major.minor.patch (e.g. 0.3.0)"
            exit 1
          fi
          if [ "$REF_TYPE" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/fogofwar/v$v" >/dev/null; then
            echo "::error::tag fogofwar/v$v already exists; pick a new version"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Stamp the version resource
        if: steps.version.outputs.release == 'true'
        run: go run ./winres -version "${{ steps.version.outputs.version }}"

      # Same flags as CLAUDE.md's local build. Not stripped (-s -w): a stripped
      # unsigned Go exe is a classic antivirus false positive.
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -tags desktop,production \
            -ldflags "-H windowsgui -X main.version=${{ steps.version.outputs.version }}" \
            -o dist/FogOfWar.exe .
          sha256sum dist/FogOfWar.exe

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: FogOfWar
          path: cmd/fogofwar/dist/FogOfWar.exe
          retention-days: 14

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: FogOfWar
          path: out

      # --latest: replay.fogofwar.dev/setup links to
      # releases/latest/download/FogOfWar.exe, so every release must become
      # "latest" (and keep that asset name) for the page to serve it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd out
          sha256sum FogOfWar.exe > FogOfWar.exe.sha256
          notes="Unsigned build: Windows shows a SmartScreen warning (More info, then Run anyway). Built by this run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release create "fogofwar/v$VERSION" FogOfWar.exe FogOfWar.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "FogOfWar $VERSION" --notes "$notes"
