<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barreplay viewer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>barreplay<span class="sub" id="subtitle">replay state viewer</span></h1>
  <div id="picker">
    <label for="file">Replay</label>
    <select id="file"></select>
  </div>
</header>

<div class="controls">
  <button id="first" title="First frame">⏮</button>
  <button id="prev" title="Previous frame (←)">◀</button>
  <button id="play" title="Play / pause (space)">▶ Play</button>
  <button id="next" title="Next frame (→)">▶</button>
  <button id="last" title="Last frame">⏭</button>
  <label style="font-size:12px;color:#9fb0bf;">Speed
    <select id="speed">
      <option value="4">4×</option>
      <option value="8">8×</option>
      <option value="16" selected>16×</option>
      <option value="30">30×</option>
      <option value="60">60×</option>
    </select>
  </label>
  <label style="font-size:12px;color:#9fb0bf;display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="icons" checked> Icons
  </label>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span class="timelabel" id="timelabel">—</span>
</div>

<div id="wrap">
  <div id="left">
    <canvas id="cv"></canvas>
    <div id="tooltip"></div>
    <div id="empty" style="display:none"></div>
  </div>
  <div id="side">
    <h2>Frame</h2>
    <div class="stat"><span>Game time</span><b id="s_time">—</b></div>
    <div class="stat"><span>Sim frame</span><b id="s_frame">—</b></div>
    <div class="stat"><span>Units</span><b id="s_units">—</b></div>

    <h2>Teams</h2>
    <div id="teams"></div>

    <h2>Recent events</h2>
    <ul id="events"></ul>

    <h2>Controls</h2>
    <div class="hint">
      Scroll to zoom · drag to pan · hover a unit for details.<br>
      ← / → step · space play/pause.
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
