<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barreplay viewer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>barreplay<span class="sub" id="subtitle">replay state viewer</span></h1>
  <div id="picker">
    <label for="file">Replay</label>
    <select id="file"></select>
  </div>
</header>

<div class="controls">
  <button id="first" title="First frame">⏮</button>
  <button id="prev" title="Previous frame (←)">◀</button>
  <button id="play" title="Play / pause (space)">▶ Play</button>
  <button id="next" title="Next frame (→)">▶</button>
  <button id="last" title="Last frame">⏭</button>
  <label style="font-size:12px;color:#9fb0bf;">Speed
    <select id="speed">
      <option value="1">1× (real time)</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
      <option value="16" selected>16×</option>
      <option value="30">30×</option>
      <option value="60">60×</option>
    </select>
  </label>
  <label style="font-size:12px;color:#9fb0bf;display:flex;align-items:center;gap:4px;" title="Show the map terrain texture">
    <input type="checkbox" id="maptex" checked> Map
  </label>
  <label style="font-size:12px;color:#9fb0bf;display:flex;align-items:center;gap:4px;" title="Show the build grid">
    <input type="checkbox" id="grid"> Grid
  </label>
  <label style="font-size:12px;color:#9fb0bf;display:flex;align-items:center;gap:4px;" title="Show building footprints">
    <input type="checkbox" id="footprints"> Footprints
  </label>
  <label style="font-size:12px;color:#9fb0bf;display:flex;align-items:center;gap:4px;" title="Checked: distinct auto colours per team. Unchecked: each team's real in-game colour from the replay.">
    <input type="checkbox" id="teamcolors" checked> Team colors
  </label>
  <label style="font-size:12px;color:#9fb0bf;display:flex;align-items:center;gap:4px;" title="Toggle icons / adjust icon size">
    <input type="checkbox" id="icons" checked> Icons
    <input type="range" id="iconsize" min="4" max="60" step="1" value="12"
           style="flex:0 0 auto;width:80px;" title="Icon size">
  </label>
  <label style="font-size:12px;color:#9fb0bf;display:flex;align-items:center;gap:4px;" title="When zoomed in, grow a building's icon to 90% of its footprint instead of a constant size">
    <input type="checkbox" id="growicons" checked> Fit icons
  </label>
  <div id="timeline">
    <input type="range" id="slider" min="0" max="0" value="0">
    <div id="buffbar" title="Downloaded ranges"></div>
  </div>
  <span id="buffering" style="display:none" title="Waiting for this part of the replay to download">buffering…</span>
  <span class="timelabel" id="timelabel">—</span>
</div>

<div id="wrap">
  <div id="left">
    <canvas id="cv"></canvas>
    <div id="tooltip"></div>
    <div id="zoomlabel"></div>
    <div id="empty" style="display:none"></div>
  </div>
  <div id="side">
    <h2>Frame</h2>
    <div class="stat"><span>Game time</span><b id="s_time">—</b></div>
    <div class="stat"><span>Sim frame</span><b id="s_frame">—</b></div>
    <div class="stat"><span>Units</span><b id="s_units">—</b></div>

    <h2>Players</h2>
    <div id="players"></div>

    <h2>Teams</h2>
    <div id="teams"></div>

    <h2>Recent events</h2>
    <ul id="events"></ul>

    <h2>Controls</h2>
    <div class="hint">
      Scroll to zoom · middle-drag to pan · hover a unit for details.<br>
      ← / → step · space play/pause.
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
